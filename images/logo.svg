<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Фон с закруглёнными углами -->
  <rect width="200" height="200" rx="32" ry="32" fill="url(#bg)"/>
  
  <!-- Здание / балка -->
  <g transform="translate(30, 50)">
    <!-- Левая колонна -->
    <rect x="20" y="20" width="16" height="100" rx="2" fill="#e2e8f0"/>
    <!-- Правая колонна -->
    <rect x="104" y="20" width="16" height="100" rx="2" fill="#e2e8f0"/>
    <!-- Верхняя балка -->
    <rect x="10" y="10" width="120" height="18" rx="3" fill="url(#beam)"/>
    <!-- Нижняя балка -->
    <rect x="10" y="112" width="120" height="18" rx="3" fill="#cbd5e1"/>
    <!-- Диагональные связи -->
    <line x1="36" y1="38" x2="104" y2="102" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="104" y1="38" x2="36" y2="102" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Настил пунктир -->
    <rect x="36" y="38" width="68" height="64" rx="2" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
  </g>
  
  <!-- Буква М внизу -->
  <text x="100" y="188" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" opacity="0.9">СМ</text>
</svg>
